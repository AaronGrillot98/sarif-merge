[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarif-merge"
version = "0.1.0"
description = "Merge, deduplicate, and consensus-score SARIF output from multiple security scanners."
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aaron Grillot" }]
keywords = ["sarif", "security", "devsecops", "static-analysis", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.scripts]
sarif-merge = "sarif_merge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
