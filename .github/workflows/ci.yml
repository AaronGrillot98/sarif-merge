# sarif-merge CI — runs the project's own test suite + dogfoods sarif-merge
# against its own scanner outputs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest bandit pip-audit

      - name: pytest
        run: python -m pytest

      - name: bandit (SAST)
        run: bandit -r src -ll -ii

      - name: pip-audit
        # --skip-editable so pip-audit ignores the editable install of
        # sarif-merge itself (which isn't on PyPI). The project has no
        # runtime third-party deps; this scan covers test/dev deps.
        run: pip-audit --strict --skip-editable

  dogfood:
    name: Dogfood — merge sarif-merge's own scanner output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install sarif-merge + scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install bandit
          python -m pip install semgrep || echo "semgrep optional"

      - name: Run bandit -> SARIF
        run: bandit -r src -f sarif -o bandit.sarif || true

      - name: Run semgrep -> SARIF
        run: semgrep --config=auto --sarif --sarif-output=semgrep.sarif src || true
        continue-on-error: true

      - name: Run sarif-merge against own scans
        run: |
          # Merge whichever SARIFs were produced. Tolerate missing files.
          inputs=()
          for f in bandit.sarif semgrep.sarif; do
            if [ -f "$f" ]; then inputs+=("$f"); fi
          done
          if [ ${#inputs[@]} -eq 0 ]; then
            echo "No SARIF inputs to merge — skipping dogfood"
            exit 0
          fi
          sarif-merge "${inputs[@]}" \
            --output merged.sarif \
            --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload merged SARIF as artifact
        if: hashFiles('merged.sarif') != ''
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: merged-sarif
          path: merged.sarif
          retention-days: 7
